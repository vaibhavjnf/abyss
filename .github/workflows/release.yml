name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: abyss-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: abyss-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: abyss-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/abyss.exe" ]; then
            cp "target/${{ matrix.target }}/release/abyss.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/abyss" "dist/${{ matrix.asset }}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          generate_release_notes: true
